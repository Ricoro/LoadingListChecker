name: Publish Windows app
on:
  push:
    branches: [main]
    paths: [.github/workflows/windows-release.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v0.7.0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Build Windows installer
        shell: bash
        run: npm run dist:win -- -c.win.signAndEditExecutable=false -c.compression=normal --publish never
      - name: Package installer and instructions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-package
          Copy-Item 'dist/Loading-List-Checker-Setup-0.7.0.exe' 'release-package/Loading-List-Checker-Setup-0.7.0.exe'
          Copy-Item README.md release-package/README.md
          Compress-Archive -Path release-package/* -DestinationPath Loading-List-Checker-Windows.zip
      - name: Upload release download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view v0.7.0 --repo Ricoro/LoadingListChecker
          if ($LASTEXITCODE -ne 0) {
            gh release create v0.7.0 --repo Ricoro/LoadingListChecker --verify-tag --title 'Loading List Checker v0.7.0' --draft --notes 'Windows x64 installer with public GitHub in-app updates. Download and extract the ZIP, then run Loading-List-Checker-Setup-0.7.0.exe. Supports Excel loading and terminal lists, delivered/outstanding highlights and marked Excel export. Files stay local. Unsigned executable; native Windows launch testing remains outstanding. No container lists are included.'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload v0.7.0 Loading-List-Checker-Windows.zip dist/Loading-List-Checker-Setup-0.7.0.exe dist/Loading-List-Checker-Setup-0.7.0.exe.blockmap dist/latest.yml --repo Ricoro/LoadingListChecker --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit v0.7.0 --repo Ricoro/LoadingListChecker --draft=false --latest

      - name: Verify public update feed without authentication
        run: node scripts/verify-update-feed.js
      - name: Verify native Windows update download without credentials
        shell: pwsh
        run: |
          $probe = Start-Process -FilePath ./node_modules/electron/dist/electron.exe -ArgumentList scripts/windows-update-smoke.cjs -Wait -PassThru
          if ($probe.ExitCode -ne 0) { exit $probe.ExitCode }
