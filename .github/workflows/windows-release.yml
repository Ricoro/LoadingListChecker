name: Publish Windows app
on:
  push:
    branches: [main]
    paths: [.github/workflows/windows-release.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v0.4.0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Build portable Windows app
        shell: bash
        run: npm run dist:win -- -c.win.signAndEditExecutable=false -c.compression=normal --publish never
      - name: Package portable app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-package
          Copy-Item 'dist/Loading List Checker 0.4.0.exe' 'release-package/Loading List Checker.exe'
          Copy-Item README.md release-package/README.md
          Compress-Archive -Path release-package/* -DestinationPath Loading-List-Checker-Windows.zip
      - name: Upload release download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view v0.4.0 --repo Ricoro/LoadingListChecker
          if ($LASTEXITCODE -ne 0) {
            gh release create v0.4.0 --repo Ricoro/LoadingListChecker --verify-tag --title 'Loading List Checker v0.4.0' --notes 'Windows x64 portable app. Download and extract the ZIP, then open Loading List Checker.exe. Supports Excel loading and terminal lists, delivered/outstanding highlights and marked Excel export. Files stay local. Unsigned executable; native Windows launch testing remains outstanding. No container lists are included.'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload v0.4.0 Loading-List-Checker-Windows.zip --repo Ricoro/LoadingListChecker --clobber
