name: Publish browser demo
on:
  push:
    branches: [main]
    paths:
      - web/**
      - src/**
      - scripts/build-web.js
      - package.json
      - package-lock.json
      - .github/workflows/web-portal.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: browser-portal
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build:web
        env:
          M365_TENANT_ID: ${{ vars.M365_TENANT_ID }}
          M365_CLIENT_ID: ${{ vars.M365_CLIENT_ID }}
          SHAREPOINT_SITE_URL: ${{ vars.SHAREPOINT_SITE_URL }}
          SHAREPOINT_HISTORY_FOLDER: ${{ vars.SHAREPOINT_HISTORY_FOLDER }}
          SHAREPOINT_DRIVE_ID: ${{ vars.SHAREPOINT_DRIVE_ID }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web
      - name: Deploy browser demo
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Check published portal
        env:
          PORTAL_URL: ${{ steps.deployment.outputs.page_url }}
        run: curl --fail --retry 5 --retry-delay 5 "$PORTAL_URL" -o /tmp/published-portal.html
